#cloud-config
# Machine-level provisioning only. Userland tools (mise, agents, terminfo) are
# installed afterwards by scripts/setup-tools.sh so they can use your mirrored
# mise config and correct ordering. No credentials are baked in here.
package_update: true
package_upgrade: false
packages:
  - curl
  - rsync
  - git
  - openssh-server
  - build-essential
  - ca-certificates
  - gnupg
  - unzip
  - jq
  - nano
  - ripgrep
  - psmisc

users:
  - name: dev
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true

write_files:
  - path: /etc/sysctl.d/99-inca.conf
    content: |
      vm.swappiness=10
  # virtio-balloon free-page-reporting only hands back free blocks of at least
  # 2^order pages. The kernel default (9 = 2MB) misses almost everything once the
  # guest's free memory is fragmented, which it always is after real work. 4 = 64KB.
  # Lower means finer reclaim and more hole-punch/refault work. See TRADEOFFS.md.
  - path: /etc/tmpfiles.d/inca-page-reporting.conf
    content: |
      w /sys/module/page_reporting/parameters/page_reporting_order - - - - 4
  # Marker so anything running in the guest can tell it's an inca dev VM.
  # profile.d covers interactive/login shells; /etc/environment (set in runcmd)
  # covers PAM sessions and most env-reading code.
  - path: /etc/profile.d/inca.sh
    content: |
      export IS_INCA=1
  - path: /usr/local/bin/inca-flush
    permissions: "0755"
    content: |
      #!/bin/sh
      # Evict the guest page cache so the next read/mmap re-fetches shared files
      # from the host. Needed because shares run io.cache=unsafe (cache=always),
      # which can leave the guest serving stale contents after a host-side edit.
      # See TRADEOFFS.md. Equivalent to `just flush <vm>` run from the host.
      exec sudo sh -c 'sync && echo 3 > /proc/sys/vm/drop_caches'

runcmd:
  # Inca marker for PAM sessions (ssh logins) and non-shell env readers.
  - [bash, -c, "grep -q '^IS_INCA=' /etc/environment || echo 'IS_INCA=1' >> /etc/environment"]
  # Guest swap so the balloon can grow/shrink without thrashing.
  - [bash, -c, "test -f /swapfile || (fallocate -l 8G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab)"]
  # Docker (nested 'just works' inside a real kernel). Convenience script is fine for dev.
  - [bash, -c, "curl -fsSL https://get.docker.com | sh"]
  - [usermod, -aG, docker, dev]
  - [systemctl, enable, --now, ssh]
  - [install, -d, -o, dev, -g, dev, -m, "0700", /home/dev/.ssh]
  - [install, -d, -o, dev, -g, dev, -m, "0755", /home/dev/work]
